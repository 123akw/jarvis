<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
:root{
  --void:#050B12; --arc:#53E8FF; --gold:#F0B45A; --alert:#FF5C4A;
  --text:#C9E6F2; --dim:#5E7E93; --line:rgba(83,232,255,.22);
  --mono:ui-monospace,Menlo,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:transparent;overflow:hidden;
  font-family:-apple-system,'PingFang SC',sans-serif;color:var(--text);
  -webkit-user-select:none;user-select:none}

/* ---------- 悬浮球（收起态，三种样式，尺寸可调） ---------- */
:root{--ball:64px}
#ball{position:fixed;right:4px;top:4px;width:var(--ball);height:var(--ball);
  border-radius:50%;cursor:grab;
  display:flex;align-items:center;justify-content:center;
  transition:transform .18s ease}
#ball:active{cursor:grabbing}
#ball:hover{transform:scale(1.05)}
#eye{pointer-events:none;width:80%;height:80%;border-radius:50%;
  position:relative;z-index:3;background:transparent;border:none}
body.expanded #ball{display:none}

/* 样式一：MOSS 能量核（默认）——玻璃球体 + 内部流体能量 */
#orb{position:absolute;inset:0;border-radius:50%;overflow:hidden;display:none;
  pointer-events:none;
  background:radial-gradient(circle at 50% 58%,#0B1119 28%,#05080D 72%,#03050A)}
body.ball-moss #orb{display:block}
.sw{position:absolute;width:130%;height:130%;left:-15%;top:-15%;border-radius:50%;
  filter:blur(4px) saturate(1.5);mix-blend-mode:screen}
.sw1{background:radial-gradient(circle at 32% 42%,rgba(255,64,40,1),rgba(255,64,40,.3) 26%,transparent 44%);
  animation:swA 7s ease-in-out infinite}
.sw2{background:radial-gradient(circle at 68% 58%,rgba(83,232,255,.95),rgba(83,232,255,.25) 22%,transparent 38%);
  animation:swB 9.5s ease-in-out infinite}
.sw3{background:radial-gradient(circle at 55% 28%,rgba(255,150,66,.75),transparent 34%);
  animation:swA 12s ease-in-out infinite reverse}
.sw4{background:radial-gradient(circle at 42% 74%,rgba(150,90,255,.7),transparent 36%);
  animation:swB 14s ease-in-out infinite reverse}
.sw5{background:radial-gradient(circle at 50% 52%,rgba(255,170,140,.95),rgba(255,42,31,.55) 26%,transparent 48%);
  animation:corePulse 3.2s ease-in-out infinite;filter:blur(3px) saturate(1.4)}
@keyframes corePulse{50%{transform:scale(.88);opacity:.8}}
@keyframes swA{
  0%,100%{transform:translate(-5%,-3%) rotate(0) scale(1)}
  33%{transform:translate(7%,5%) rotate(120deg) scale(1.18)}
  66%{transform:translate(-3%,7%) rotate(240deg) scale(.92)}}
@keyframes swB{
  0%,100%{transform:translate(4%,2%) rotate(0) scale(1.05)}
  50%{transform:translate(-6%,-5%) rotate(180deg) scale(.9)}}
body.ball-moss #ball{border:1px solid rgba(150,225,255,.30);
  box-shadow:0 6px 20px rgba(0,0,0,.55),0 0 22px rgba(255,60,40,.28),
    0 0 34px rgba(83,232,255,.14)}
body.ball-moss #ball::before{content:'';position:absolute;left:22%;top:8%;width:56%;height:26%;
  border-radius:50%;z-index:2;pointer-events:none;filter:blur(2px);
  background:linear-gradient(rgba(255,255,255,.20),rgba(255,255,255,0))}
body.ball-moss #ball::after{content:'';position:absolute;inset:0;border-radius:50%;z-index:2;
  pointer-events:none;
  box-shadow:inset 0 -8px 16px rgba(0,0,0,.55),inset 0 0 10px rgba(83,232,255,.08)}
body.busy.ball-moss .sw{animation-duration:2.6s}

/* 样式二：极简暗球——低调小黑球 + 微红点 */
body.ball-mini #ball{
  background:radial-gradient(circle at 34% 28%,#2A323C,#14181E 68%,#0B0E12);
  border:1px solid rgba(255,255,255,.08);
  box-shadow:0 3px 12px rgba(0,0,0,.5)}
body.ball-mini #ball::after{content:'';position:absolute;right:16%;bottom:16%;
  width:18%;height:18%;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#FF8A7C,#FF2A1F 60%,#7A0E08);
  box-shadow:0 0 8px rgba(255,42,31,.8);animation:breath 3s infinite}

/* 样式三：自定义图片——圆形头像 + 细环 */
body.ball-img #ball{
  background-image:var(--ball-img);background-size:cover;background-position:center;
  border:2px solid rgba(83,232,255,.45);
  box-shadow:0 4px 16px rgba(0,0,0,.55),0 0 14px rgba(83,232,255,.2)}
body.ball-img #ball::after{content:'';position:absolute;right:6%;bottom:6%;
  width:16%;height:16%;border-radius:50%;border:1.5px solid rgba(5,11,18,.9);
  background:#FF2A1F;box-shadow:0 0 6px rgba(255,42,31,.9);animation:breath 3s infinite}

@keyframes breath{50%{opacity:.72;transform:scale(.95)}}
body.busy.ball-mini #ball::after,body.busy.ball-img #ball::after{animation-duration:.9s}

/* ---------- 对话面板（展开态） ---------- */
#panel{display:none;position:fixed;inset:6px;flex-direction:column;
  background:#060C13;border:1px solid var(--line);
  box-shadow:0 16px 48px rgba(0,0,0,.6);
  clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
body.expanded #panel{display:flex}
#phead{-webkit-app-region:drag;display:flex;align-items:center;gap:9px;
  padding:10px 14px;border-bottom:1px solid var(--line);flex:none}
#mini-eye{width:16px;height:16px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 40% 36%,#FFB3A6,#FF2A1F 40%,#5A0A05);
  box-shadow:0 0 8px rgba(255,42,31,.8);animation:breath 3s infinite}
#ptitle{font-family:var(--mono);font-size:12px;letter-spacing:.22em;color:var(--arc)}
#pstate{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.1em}
#phead .sp{flex:1}
.hbtn{-webkit-app-region:no-drag;background:none;border:1px solid var(--line);
  color:var(--dim);font-size:13px;width:26px;height:22px;cursor:pointer;line-height:1}
.hbtn:hover{color:var(--arc)}
#plog{flex:1;overflow-y:auto;padding:14px 14px 6px;display:flex;flex-direction:column;gap:12px}
#plog::-webkit-scrollbar{width:4px}
#plog::-webkit-scrollbar-thumb{background:rgba(83,232,255,.3)}
.m-user{align-self:flex-end;max-width:86%;background:rgba(240,180,90,.14);
  border-right:2px solid var(--gold);padding:7px 11px;font-size:13.5px;
  line-height:1.6;white-space:pre-wrap}
.m-ai{align-self:stretch;border-left:2px solid rgba(83,232,255,.4);
  padding:2px 2px 2px 11px;font-size:13.5px;line-height:1.7}
.m-ai b{color:#fff}
.m-ai code{font-family:var(--mono);font-size:12px;color:var(--arc);
  background:rgba(83,232,255,.09);padding:0 3px}
.m-ai pre{background:rgba(3,10,18,.85);border:1px solid var(--line);padding:8px 10px;
  overflow-x:auto;font-family:var(--mono);font-size:12px;margin:6px 0;line-height:1.55}
.m-ai ul,.m-ai ol{margin:4px 0 4px 18px}
.caret{display:inline-block;width:7px;height:13px;background:var(--arc);
  vertical-align:-2px;animation:blink .8s steps(1) infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}
.sys{align-self:center;font-family:var(--mono);font-size:11px;color:var(--alert)}
.tool{font-family:var(--mono);font-size:10.5px;color:var(--arc);opacity:.8;margin-bottom:3px}
#pinput{flex:none;display:flex;align-items:flex-end;gap:8px;margin:8px 12px 12px;
  background:rgba(13,28,44,.6);border:1px solid var(--line);padding:8px 10px}
#pinput:focus-within{border-color:rgba(83,232,255,.55)}
#box{flex:1;background:transparent;border:none;outline:none;color:var(--text);
  font-size:13.5px;font-family:inherit;resize:none;max-height:96px;line-height:1.5;
  caret-color:var(--arc);-webkit-user-select:text;user-select:text}
#box::placeholder{color:var(--dim)}
#send{width:30px;height:30px;flex:none;border:none;font-size:14px;cursor:pointer;
  color:var(--void);background:var(--arc)}
#send:disabled{opacity:.35}
#plog .empty{color:var(--dim);font-family:var(--mono);font-size:12px;
  letter-spacing:.1em;text-align:center;padding:26px 0 10px}
.qchips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding-bottom:10px}
.qchips button{background:rgba(13,28,44,.6);border:1px solid var(--line);color:var(--text);
  font-size:12.5px;padding:7px 12px;cursor:pointer;transition:border-color .2s,color .2s}
.qchips button:hover{border-color:rgba(83,232,255,.5);color:var(--arc)}
#clipbar{margin:0 12px;background:rgba(240,180,90,.1);border:1px dashed rgba(240,180,90,.45);
  color:var(--gold);font-size:12px;font-family:var(--mono);letter-spacing:.06em;
  padding:7px 10px;cursor:pointer;text-align:left;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
#clipbar:hover{background:rgba(240,180,90,.18)}

/* ---------- 任务台 ---------- */
#board{display:none;position:absolute;inset:0;background:#050B12;
  z-index:5;flex-direction:column}
body.show-board #board{display:flex}
.b-sec{border:1px solid var(--line);padding:10px 12px}
.b-title{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--arc);
  margin-bottom:8px}
.b-list{font-size:13px;line-height:1.7;color:var(--text)}
.b-list .row{display:flex;gap:8px;padding:3px 0;border-bottom:1px dashed rgba(83,232,255,.1)}
.b-list .row:last-child{border-bottom:none}
.b-list .tag{font-family:var(--mono);font-size:11px;color:var(--dim);white-space:nowrap;padding-top:2px}
.b-list .tag.on{color:#7CF5B2}
.b-list .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.b-off{color:var(--dim);font-family:var(--mono);font-size:11.5px;letter-spacing:.06em}
.b-list .sub{font-family:var(--mono);font-size:11px;color:var(--dim);
  margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.b-empty{color:var(--dim);font-family:var(--mono);font-size:12px}

/* ---------- 设置面板 ---------- */
#settings{display:none;position:absolute;inset:0;background:#050B12;
  z-index:5;flex-direction:column}
body.show-settings #settings{display:flex}
.s-head{-webkit-app-region:drag;display:flex;align-items:center;gap:10px;
  padding:10px 14px;border-bottom:1px solid var(--line)}
.s-title{font-family:var(--mono);font-size:12px;letter-spacing:.3em;color:var(--arc)}
.s-body{flex:1;overflow-y:auto;padding:18px 18px;display:flex;flex-direction:column;gap:18px}
.s-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.s-row.s-col{flex-direction:column;align-items:stretch;gap:8px}
.s-row>span{color:var(--text);letter-spacing:.06em}
.s-row select,.s-row input[type=text]{background:rgba(13,28,44,.7);border:1px solid var(--line);
  color:var(--text);font-size:13px;padding:9px 10px;outline:none;font-family:inherit;
  -webkit-user-select:text;user-select:text}
.s-row select:focus,.s-row input[type=text]:focus{border-color:rgba(83,232,255,.55)}
.s-row input[type=checkbox]{width:18px;height:18px;accent-color:#53E8FF}
.s-hint{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.06em;min-height:14px}
.s-hint.ok{color:#7CF5B2}
.s-hint.bad{color:var(--alert)}
.s-hint.wait{color:var(--gold)}
#s-save{border:none;background:var(--arc);color:var(--void);font-size:13px;
  letter-spacing:.2em;padding:11px 0;cursor:pointer;font-weight:600}
#s-save:hover{box-shadow:0 0 18px rgba(83,232,255,.5)}
.s-slider{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--dim)}
.s-slider input[type=range]{flex:1;accent-color:#53E8FF}
.s-slider em{font-family:var(--mono);font-style:normal;color:var(--text);min-width:44px;text-align:right}
#s-imgrow{display:flex;align-items:center;gap:10px}
#s-imgpick{background:rgba(13,28,44,.7);border:1px solid var(--line);color:var(--text);
  font-size:13px;padding:8px 14px;cursor:pointer}
#s-imgpick:hover{border-color:rgba(83,232,255,.5)}
#s-imgprev{width:44px;height:44px;border-radius:50%;object-fit:cover;
  border:2px solid rgba(83,232,255,.45);display:none}
.hk-line{display:flex;gap:8px;align-items:stretch}
.hk-field{flex:1;background:rgba(13,28,44,.7);border:1px solid var(--line);
  color:var(--text);font-size:15px;padding:11px 10px;cursor:pointer;
  font-family:var(--mono);letter-spacing:.18em;text-align:center;transition:border-color .2s}
.hk-field:hover{border-color:rgba(83,232,255,.45)}
.hk-field.rec{border:1px dashed var(--gold);color:var(--gold);animation:pulse 1.2s infinite}
.hk-field.off{color:var(--dim);letter-spacing:.06em;font-size:13px}
.hk-x{height:auto}
@keyframes pulse{50%{opacity:.55}}
.wx-setting{padding-top:16px;border-top:1px solid var(--line)}
#wx-area{min-height:40px;display:grid;place-items:center;gap:10px}
#wx-area button{width:100%;border:1px solid rgba(83,232,255,.5);background:rgba(83,232,255,.08);
  color:var(--arc);font-family:var(--mono);font-size:12px;letter-spacing:.08em;padding:9px;cursor:pointer}
#wx-area button:hover{background:rgba(83,232,255,.16)}
#wx-area #wx-disc{color:var(--alert);border-color:rgba(255,92,92,.42);background:rgba(255,92,92,.06)}
#wx-qr{display:block;width:220px;height:220px;object-fit:contain;padding:10px;background:#fff;
  box-shadow:0 0 24px rgba(83,232,255,.16)}
.wx-risk{font-family:var(--mono);font-size:10px;color:var(--dim);line-height:1.55}
</style>
</head>
<body>
  <div id="ball" title="按住拖动">
    <div id="orb"><i class="sw sw1"></i><i class="sw sw2"></i><i class="sw sw3"></i><i class="sw sw4"></i><i class="sw sw5"></i></div>
    <div id="eye" title="打开对话"></div>
  </div>

  <div id="panel">
    <div id="phead">
      <div id="mini-eye"></div>
      <span id="ptitle">J.A.R.V.I.S.</span>
      <span id="pstate">连接中…</span>
      <span class="sp"></span>
      <button class="hbtn" id="boardbtn" title="任务台">📋</button>
      <button class="hbtn" id="setbtn" title="设置">⚙</button>
      <button class="hbtn" id="clearbtn" title="清空快捷对话">↺</button>
      <button class="hbtn" id="minbtn" title="收起为悬浮球">—</button>
    </div>
    <div id="plog"><div class="empty">正在取回最近的对话…</div></div>
    <button id="clipbar" style="display:none"></button>
    <div id="pinput">
      <textarea id="box" rows="1" placeholder="小声吩咐一句…（Enter 发送）"></textarea>
      <button id="send" title="发送">↑</button>
    </div>

    <div id="board">
      <div class="s-head">
        <button class="hbtn" id="boardback" title="返回">←</button>
        <span class="s-title">任 务 台</span>
        <span class="sp"></span>
        <button class="hbtn" id="boardrefresh" title="刷新">↻</button>
      </div>
      <div class="s-body" id="board-body">
        <div class="b-sec"><div class="b-title">⌨ Claude Code 编程进度</div><div id="b-coding" class="b-list"></div></div>
        <div class="b-sec"><div class="b-title">📅 今日日程</div><div id="b-sched" class="b-list"></div></div>
        <div class="b-sec"><div class="b-title">☑ 待办事项</div><div id="b-todos" class="b-list"></div></div>
        <div class="b-sec"><div class="b-title">🕊 飞书</div><div class="b-list b-off">未接入 · 需要企业应用凭证（app_id / secret）</div></div>
        <div class="b-sec"><div class="b-title">💼 企业微信</div><div class="b-list b-off">未接入 · 需要企业应用凭证（corp_id / secret）</div></div>
      </div>
    </div>

    <div id="settings">
      <div class="s-head">
        <button class="hbtn" id="backbtn" title="返回">←</button>
        <span class="s-title">设 置</span>
      </div>
      <div class="s-body">
        <label class="s-row">
          <span>开机自启</span>
          <input type="checkbox" id="s-autolaunch">
        </label>
        <div class="s-row s-col">
          <span>全局唤醒快捷键</span>
          <div class="hk-line">
            <button type="button" id="hk-rec" class="hk-field">点击这里，然后按下组合键</button>
            <button type="button" class="hbtn hk-x" id="hk-clear" title="停用快捷键">✕</button>
          </div>
          <div class="s-hint" id="s-hotkey-state"></div>
        </div>
        <div class="s-row s-col">
          <span>悬浮球样式</span>
          <select id="s-ballstyle">
            <option value="moss">MOSS 能量核</option>
            <option value="mini">极简暗球</option>
            <option value="img">自定义图片</option>
          </select>
          <div id="s-imgrow" style="display:none">
            <button type="button" id="s-imgpick">选择图片…</button>
            <img id="s-imgprev" alt="">
          </div>
          <label class="s-slider">
            <span>大小</span>
            <input type="range" id="s-ballsize" min="44" max="120" step="4">
            <em id="s-ballsize-v">64px</em>
          </label>
          <input type="file" id="s-imgfile" accept="image/*" style="display:none">
        </div>
        <div class="s-row s-col">
          <span>服务器地址</span>
          <input type="text" id="s-server" placeholder="https://jws.gkgeek-set.cn">
        </div>
        <div class="s-row s-col wx-setting">
          <span>个人微信</span>
          <div id="wx-area"></div>
          <div class="s-hint" id="wx-state">正在读取微信桥状态…</div>
          <div class="wx-risk">建议使用专用小号；第三方接入存在账号风险，勿群发或营销。</div>
        </div>
        <button id="s-save">保存并应用</button>
        <div class="s-hint" id="s-msg"></div>
      </div>
    </div>
  </div>

  <script src="wechat-ui.js"></script>
  <script src="auth.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
