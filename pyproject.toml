[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "1.0.0"
description = "终端私人管家贾维斯：LangGraph 底座 + SQLite 持久记忆 + 本地工具"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.2",
    "langchain-openai>=1.4",
    "langgraph-checkpoint-sqlite>=3.1",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "segno>=1.6",
    "httpx>=0.27",
    "ddgs==9.14.4",
    "trafilatura==2.1.0",
    "pwdlib[argon2]>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pip-tools==7.6.0", "tox==4.58.0", "PyYAML==6.0.3"]
browser = ["playwright==1.61.0"]

[project.scripts]
jarvis = "jarvis.cli:main"
jarvis-web = "jarvis.server:run"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.package-data]
# web/* 只匹配顶层文件，漏掉 web/assets/ 会让非 editable 安装缺前端资源（2026-08-12 黑屏事故）。
# 生产部署必须用 pip install -e .，否则 git pull 后服务跑的仍是 site-packages 旧快照。
jarvis = ["web/*", "web/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
